version: '3.8'

name: pi-staking-platform

services:
  mysql:
    image: mysql:8
    container_name: pi_staking_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pi_staking_dev
      MYSQL_USER: pistaking
      MYSQL_PASSWORD: pistaking_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pi_staking_network

  redis:
    image: redis:7-alpine
    container_name: pi_staking_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pi_staking_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pi_staking_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - pi_staking_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  pi_staking_network:
    driver: bridge
    name: pi_staking_network
